# 把本服务接到已有 nginx / OpenResty 上。
#
# 三条必须是死规矩，否则网关拉不到索引：
#
# 1. proxy_intercept_errors off
#    容器化面板（1Panel 等）默认把 404 换成自己的 HTML 页面并返回 200，
#    网关只会报「索引不可用或格式无效」。必须显式关掉错误页拦截。
#
# 2. 不要让 server 块做 80 -> 443 跳转后又被填成 http 地址
#    网关的 Transport 固定 follow_redirects=False，任何 3xx 都判源失效。
#    在网关里配置源地址时直接写 https://。
#
# 3. 不要用 try_files $uri /index.html 之类兜底
#    兜底会把不存在的路径变成 200 + HTML，同样让网关误判。
#
# 把下面的 location 放进对应 server 块即可；服务只监听回环，必须经反代暴露。

location ^~ / {
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # 索引必须实时生效，不能被中间层缓存
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;

    # 只给自己用时，把来源 IP 白名单打开（家宽 IP 变动会 403）
    # allow 203.0.113.10;
    # deny all;
}
